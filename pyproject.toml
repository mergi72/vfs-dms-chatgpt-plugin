[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vfs-dms-chatgpt-plugin"
version = "0.2.0"
description = "Read-only VFS DMS plugin for ChatGPT and Codex."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "VFS Platform" }]

[project.optional-dependencies]
dev = ["pytest>=9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
only-include = [".codex-plugin", ".mcp.json", "config", "skills", "LICENSE", "README.md"]
